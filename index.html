<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A QuantImport está sendo reformulada.">
  <meta name="theme-color" content="#0f5f45">
  <title>QuantImport | Estamos em obra</title>
  <style>
    :root {
      color-scheme: light;
      --green-deep: #0b3f31;
      --green: #0f5f45;
      --green-soft: #dcebe4;
      --sky: #d8eef5;
      --earth: #9a6b4f;
      --ink: #17342b;
      --paper: rgba(255, 255, 255, 0.88);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
      margin: 0;
    }

    body {
      display: grid;
      place-items: center;
      padding: 32px 20px;
      overflow: hidden;
      color: var(--ink);
      background:
        radial-gradient(circle at 12% 16%, rgba(255, 255, 255, 0.9) 0 7%, transparent 24%),
        linear-gradient(155deg, var(--sky) 0%, #f7fbf8 48%, var(--green-soft) 100%);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      z-index: -1;
      border-radius: 999px;
      filter: blur(1px);
    }

    body::before {
      width: 420px;
      height: 420px;
      top: -210px;
      right: -120px;
      background: rgba(15, 95, 69, 0.13);
    }

    body::after {
      width: 360px;
      height: 360px;
      left: -175px;
      bottom: -210px;
      background: rgba(154, 107, 79, 0.11);
    }

    main {
      width: min(680px, 100%);
      padding: clamp(36px, 7vw, 68px);
      text-align: center;
      background: var(--paper);
      border: 1px solid rgba(255, 255, 255, 0.95);
      border-radius: 28px;
      box-shadow: 0 24px 70px rgba(11, 63, 49, 0.14);
      backdrop-filter: blur(10px);
    }

    .brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      margin-bottom: 42px;
    }

    .brand img {
      width: 74px;
      height: 74px;
      object-fit: contain;
    }

    .brand-name {
      color: var(--green-deep);
      font-size: clamp(1.55rem, 4vw, 2.2rem);
      font-weight: 750;
      letter-spacing: -0.035em;
    }

    .marker {
      width: 52px;
      height: 4px;
      margin: 0 auto 22px;
      border-radius: 999px;
      background: var(--earth);
    }

    h1 {
      margin: 0;
      color: var(--green);
      font-size: clamp(2.5rem, 8vw, 4.8rem);
      line-height: 0.98;
      letter-spacing: -0.055em;
    }

    p {
      max-width: 440px;
      margin: 26px auto 0;
      font-size: clamp(1.05rem, 2.5vw, 1.28rem);
      line-height: 1.6;
    }

    @media (max-width: 520px) {
      main {
        border-radius: 22px;
      }

      .brand {
        margin-bottom: 34px;
      }

      .brand img {
        width: 60px;
        height: 60px;
      }
    }
  </style>
</head>
<body>
  <main>
    <div class="brand">
      <img src="logo.png" alt="Logotipo da QuantImport">
      <span class="brand-name">QuantImport</span>
    </div>

    <div class="marker" aria-hidden="true"></div>
    <h1>Estamos em obra.</h1>
    <p>A QuantImport está sendo reformulada.</p>
  </main>
</body>
</html>
